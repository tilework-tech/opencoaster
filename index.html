<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10151b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>OpenCoaster</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f4f0dd;
        background: #10151b;
      }
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #10151b;
        overflow: hidden;
      }
      #app {
        position: relative;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100dvh;
        touch-action: none;
        cursor: crosshair;
      }
      .weather-overlay {
        position: fixed;
        z-index: 2;
        inset: 0;
        pointer-events: none;
      }
      .weather-cloudy {
        background: rgba(25, 36, 48, 0.08);
      }
      .weather-rain,
      .weather-storm {
        background-color: rgba(22, 34, 50, 0.1);
        background-image: repeating-linear-gradient(
          108deg,
          transparent 0 19px,
          #d7e7ff55 20px 21px,
          transparent 22px 38px
        );
        background-size: 38px 54px;
        animation: rain-drift 0.65s linear infinite;
      }
      .weather-storm {
        background-color: rgba(8, 15, 30, 0.18);
        background-image: repeating-linear-gradient(
          108deg,
          transparent 0 13px,
          #c6d5ef66 14px 16px,
          transparent 17px 29px
        );
        background-size: 29px 42px;
      }
      @keyframes rain-drift {
        to {
          background-position: -24px 54px;
        }
      }
      .track-preview {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100vw;
        height: 100dvh;
        pointer-events: none;
      }
      .terrain-aids {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100vw;
        height: 100dvh;
        pointer-events: none;
      }
      [hidden] {
        display: none !important;
      }
      #app.title-open .hud,
      #app.title-open .objective-strip {
        display: none;
      }
      #app.title-open .park-news {
        display: none;
      }
      .park-news {
        position: fixed;
        z-index: 4;
        top: 74px;
        left: 50%;
        width: min(520px, calc(100vw - 32px));
        transform: translateX(-50%);
        margin: 0;
        padding: 8px 12px;
        border: 1px solid #879073;
        border-radius: 6px;
        background: #18211eef;
        color: #fff1bf;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-line;
        pointer-events: none;
      }
      #app.title-open .weather-overlay {
        display: none;
      }
      .title-screen,
      .save-menu,
      .outcome-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 14, 0.78);
      }
      .title-panel,
      .save-panel,
      .outcome-dialog {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(580px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        overflow: auto;
        box-sizing: border-box;
        padding: 22px 26px;
        border: 1px solid #879073;
        border-radius: 10px;
        background: linear-gradient(#2d3830, #1b2320);
        box-shadow: 0 10px 40px #000a;
      }
      .title-heading {
        margin: 0;
        color: #fff1bf;
        font-size: 34px;
        letter-spacing: 0.02em;
      }
      .title-tagline,
      .scenario-description,
      .slot-meta,
      .outcome-text,
      .slot-empty {
        margin: 0;
        color: #c9d1bc;
        font-size: 13px;
        line-height: 1.5;
      }
      .title-message,
      .save-message {
        min-height: 1.4em;
        margin: 0;
        color: #f3c27a;
        font-size: 13px;
      }
      .menu-button {
        align-self: flex-start;
        min-height: 34px;
        padding: 6px 12px;
        border: 1px solid #879073;
        border-radius: 5px;
        background: linear-gradient(#647054, #3c493c);
        color: #fff5d7;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .menu-button:hover:not(:disabled) {
        filter: brightness(1.2);
      }
      .menu-button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .menu-button.secondary {
        background: linear-gradient(#4a5246, #2c332d);
      }
      .scenario-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .scenario-card,
      .slot-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid #56604d;
        border-radius: 6px;
        background: #1e2622;
      }
      .scenario-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .scenario-name {
        margin: 0;
        color: #fff1bf;
        font-size: 18px;
      }
      .slot-info {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .slot-name {
        color: #fff1bf;
        overflow-wrap: anywhere;
      }
      .slot-actions,
      .save-new,
      .save-files {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .save-new .save-name {
        flex: 1;
        min-width: 180px;
      }
      .save-name {
        min-height: 30px;
        padding: 4px 8px;
        border: 1px solid #879073;
        border-radius: 4px;
        background: #111714;
        color: #f4f0dd;
        font: inherit;
      }
      .save-header {
        color: #fff1bf;
        font-size: 18px;
        font-weight: 700;
      }
      .save-section {
        margin: 6px 0 0;
        color: #aab39a;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .outcome-heading {
        margin: 0;
        color: #fff1bf;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
