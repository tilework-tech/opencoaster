<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCoaster</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f4f0dd;
        background: #10151b;
      }
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #10151b;
        overflow: hidden;
      }
      #app {
        position: relative;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        cursor: crosshair;
      }
      .weather-overlay {
        position: fixed;
        z-index: 2;
        inset: 0;
        pointer-events: none;
      }
      .weather-cloudy {
        background: rgba(25, 36, 48, 0.16);
      }
      .weather-rain,
      .weather-storm {
        background-color: rgba(22, 34, 50, 0.21);
        background-image: repeating-linear-gradient(
          108deg,
          transparent 0 19px,
          #d7e7ff55 20px 21px,
          transparent 22px 38px
        );
        background-size: 38px 54px;
        animation: rain-drift 0.65s linear infinite;
      }
      .weather-storm {
        background-color: rgba(8, 15, 30, 0.4);
        background-image: repeating-linear-gradient(
          108deg,
          transparent 0 13px,
          #c6d5ef66 14px 16px,
          transparent 17px 29px
        );
        background-size: 29px 42px;
      }
      @keyframes rain-drift {
        to {
          background-position: -24px 54px;
        }
      }
      .game-toolbar {
        position: fixed;
        z-index: 5;
        inset: 10px 10px auto 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 7px;
        border: 1px solid #6f725e;
        border-radius: 7px;
        background: linear-gradient(#475143, #262f2b 44%, #1b2422);
        box-shadow: 0 3px 12px #0008;
      }
      .game-toolbar button,
      .info-window button {
        min-height: 30px;
        padding: 4px 9px;
        border: 1px solid #879073;
        border-radius: 4px;
        background: linear-gradient(#647054, #3c493c);
        color: #fff5d7;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .game-toolbar button:hover,
      .info-window button:hover {
        filter: brightness(1.2);
      }
      .game-toolbar button[aria-pressed='true'] {
        border-color: #f1d36e;
        background: linear-gradient(#987d38, #6c592d);
      }
      .tool-group,
      .window-tools {
        display: flex;
        gap: 4px;
      }
      .tool-group {
        padding-left: 6px;
        border-left: 1px solid #879073;
      }
      .window-tools {
        margin-left: auto;
      }
      .hud {
        position: fixed;
        z-index: 4;
        right: 12px;
        bottom: 12px;
        margin: 0;
        padding: 8px 10px;
        border: 1px solid #54636b;
        border-radius: 5px;
        color: #cfe8ff;
        background: rgba(9, 15, 19, 0.82);
        font:
          11px/1.45 ui-monospace,
          monospace;
        pointer-events: none;
      }
      .tool-status {
        position: fixed;
        z-index: 4;
        bottom: 12px;
        left: 12px;
        padding: 8px 10px;
        border: 1px solid #887b55;
        border-radius: 5px;
        color: #fff0bd;
        background: rgba(20, 24, 21, 0.84);
        font-size: 12px;
      }
      .coaster-panel {
        position: fixed;
        z-index: 6;
        top: 62px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: min(290px, calc(100vw - 24px));
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #8d8b71;
        border-radius: 6px;
        background: #202923f2;
        box-shadow: 0 5px 18px #0009;
        font-size: 12px;
      }
      .coaster-panel[hidden],
      .coaster-section[hidden] {
        display: none;
      }
      .coaster-panel strong {
        color: #fff1bf;
      }
      .coaster-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .coaster-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .coaster-panel select,
      .coaster-panel button {
        min-height: 26px;
        border: 1px solid #879073;
        border-radius: 4px;
        background: #3c493c;
        color: #fff5d7;
        font: inherit;
      }
      .coaster-panel select {
        flex: 1;
        max-width: 190px;
      }
      .coaster-panel button {
        flex: 1;
        padding: 3px 8px;
        cursor: pointer;
      }
      .coaster-panel button[aria-pressed='true'] {
        background: #7a8a52;
      }
      .coaster-panel button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .coaster-cost,
      .coaster-info {
        margin: 0;
        color: #e1e6d8;
        font:
          12px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      .coaster-feedback {
        min-height: 18px;
        color: #ffb4a8;
      }
      .coaster-feedback[data-ok='true'] {
        color: #b8f0b0;
      }
      .track-preview {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      .info-window {
        position: fixed;
        z-index: 6;
        top: 62px;
        right: 12px;
        width: min(260px, calc(100vw - 24px));
        border: 1px solid #8d8b71;
        border-radius: 6px;
        background: #202923f2;
        box-shadow: 0 5px 18px #0009;
      }
      .info-window:nth-of-type(2) {
        top: 290px;
      }
      .info-window:nth-of-type(3) {
        top: 518px;
      }
      .info-window header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 34px;
        padding: 0 6px 0 10px;
        border-bottom: 1px solid #646b59;
        color: #fff1bf;
        background: linear-gradient(#565f48, #353e32);
      }
      .info-window button {
        min-height: 24px;
        padding: 2px 7px;
      }
      .panel-content {
        margin: 0;
        padding: 11px;
        color: #e1e6d8;
        font:
          12px/1.6 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      @media (max-width: 760px) {
        .game-toolbar {
          inset: 6px 6px auto;
          gap: 4px;
          padding: 5px;
          flex-wrap: nowrap;
          overflow-x: auto;
          overflow-y: hidden;
          touch-action: pan-x;
          scrollbar-width: none;
        }
        .game-toolbar::-webkit-scrollbar {
          display: none;
        }
        .game-toolbar button,
        .tool-group,
        .window-tools {
          flex: 0 0 auto;
          white-space: nowrap;
        }
        .game-toolbar button {
          min-height: 28px;
          padding: 4px 6px;
          font-size: 11px;
        }
        .window-tools {
          margin-left: 0;
        }
        .info-window {
          top: auto;
          right: 8px;
          bottom: 62px;
        }
      }
      [hidden] {
        display: none !important;
      }
      #app.title-open .game-toolbar,
      #app.title-open .tool-status,
      #app.title-open .hud,
      #app.title-open .info-window,
      #app.title-open .objective-strip {
        display: none;
      }
      #app.title-open .weather-overlay {
        display: none;
      }
      .title-screen,
      .save-menu,
      .outcome-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 14, 0.78);
      }
      .title-panel,
      .save-panel,
      .outcome-dialog {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(580px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        overflow: auto;
        box-sizing: border-box;
        padding: 22px 26px;
        border: 1px solid #879073;
        border-radius: 10px;
        background: linear-gradient(#2d3830, #1b2320);
        box-shadow: 0 10px 40px #000a;
      }
      .title-heading {
        margin: 0;
        color: #fff1bf;
        font-size: 34px;
        letter-spacing: 0.02em;
      }
      .title-tagline,
      .scenario-description,
      .slot-meta,
      .outcome-text,
      .slot-empty {
        margin: 0;
        color: #c9d1bc;
        font-size: 13px;
        line-height: 1.5;
      }
      .title-message,
      .save-message {
        min-height: 1.4em;
        margin: 0;
        color: #f3c27a;
        font-size: 13px;
      }
      .menu-button {
        align-self: flex-start;
        min-height: 34px;
        padding: 6px 12px;
        border: 1px solid #879073;
        border-radius: 5px;
        background: linear-gradient(#647054, #3c493c);
        color: #fff5d7;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .menu-button:hover:not(:disabled) {
        filter: brightness(1.2);
      }
      .menu-button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .menu-button.secondary {
        background: linear-gradient(#4a5246, #2c332d);
      }
      .scenario-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .scenario-card,
      .slot-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid #56604d;
        border-radius: 6px;
        background: #1e2622;
      }
      .scenario-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .scenario-name {
        margin: 0;
        color: #fff1bf;
        font-size: 18px;
      }
      .slot-info {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .slot-name {
        color: #fff1bf;
        overflow-wrap: anywhere;
      }
      .slot-actions,
      .save-new,
      .save-files {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .save-new .save-name {
        flex: 1;
        min-width: 180px;
      }
      .save-name {
        min-height: 30px;
        padding: 4px 8px;
        border: 1px solid #879073;
        border-radius: 4px;
        background: #111714;
        color: #f4f0dd;
        font: inherit;
      }
      .save-header {
        color: #fff1bf;
        font-size: 18px;
        font-weight: 700;
      }
      .save-section {
        margin: 6px 0 0;
        color: #aab39a;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .objective-strip {
        position: fixed;
        z-index: 4;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 12px;
        border: 1px solid #887b55;
        border-radius: 5px;
        background: rgba(20, 24, 21, 0.86);
        color: #fff0bd;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        pointer-events: none;
      }
      .outcome-heading {
        margin: 0;
        color: #fff1bf;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
