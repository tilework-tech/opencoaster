<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>OpenCoaster world art</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.4 system-ui,
          sans-serif;
        background: #141a1d;
        color: #e9e5d5;
      }
      body {
        margin: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 12px 16px;
        background: #202a29ee;
        border-bottom: 1px solid #53615a;
      }
      h1 {
        margin: 0 12px 0 0;
        font-size: 18px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input,
      select {
        max-width: min(320px, 72vw);
      }
      #count {
        margin-left: auto;
        color: #bdc9b5;
      }
      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
        padding: 14px;
      }
      article {
        min-width: 0;
        padding: 10px;
        border: 1px solid #35433d;
        border-radius: 6px;
        background: #202726;
      }
      article h2 {
        overflow-wrap: anywhere;
        margin: 0 0 8px;
        color: #e9dba7;
        font:
          12px/1.3 ui-monospace,
          monospace;
      }
      .artwork {
        display: grid;
        min-height: 128px;
        place-items: center;
        overflow: auto;
        background-color: #647264;
        background-image:
          linear-gradient(45deg, #526052 25%, transparent 25%),
          linear-gradient(-45deg, #526052 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #526052 75%),
          linear-gradient(-45deg, transparent 75%, #526052 75%);
        background-size: 16px 16px;
        background-position:
          0 0,
          0 8px,
          8px -8px,
          -8px 0;
      }
      canvas {
        image-rendering: pixelated;
      }
      .details {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        color: #b5c0b3;
        font:
          11px ui-monospace,
          monospace;
      }
      .frame {
        margin-top: 8px;
      }
      #error {
        padding: 24px;
        color: #ffb6a7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>OpenCoaster world art</h1>
      <label
        >Category
        <select id="category">
          <option value="">All</option>
        </select></label
      >
      <label>Find <input id="search" type="search" placeholder="terrain/grass" /></label>
      <label>Scale <input id="scale" type="range" min="1" max="5" value="2" /></label>
      <label><input id="transparent" type="checkbox" checked /> Checkerboard</label>
      <span id="count"></span>
    </header>
    <main id="gallery"></main>
    <p id="error" hidden></p>
    <script type="module">
      const response = await fetch('/sprites/manifest.json');
      if (!response.ok) throw new Error(`Manifest request failed: ${response.status}`);
      const manifest = await response.json();
      const atlas = new Image();
      atlas.src = '/sprites/atlas.png';
      await atlas.decode();

      const category = document.querySelector('#category');
      const search = document.querySelector('#search');
      const scale = document.querySelector('#scale');
      const transparent = document.querySelector('#transparent');
      const gallery = document.querySelector('#gallery');
      const count = document.querySelector('#count');
      const groups = [
        ...new Set(Object.keys(manifest.sprites).map((name) => name.split('/')[0])),
      ].sort();
      for (const group of groups) category.add(new Option(group, group));

      function render() {
        gallery.replaceChildren();
        const zoom = Number(scale.value);
        const filter = search.value.trim().toLowerCase();
        const sprites = Object.entries(manifest.sprites).filter(
          ([name]) =>
            (!category.value || name.startsWith(`${category.value}/`)) &&
            name.toLowerCase().includes(filter),
        );
        count.textContent = `${sprites.length} sprites`;
        for (const [name, sprite] of sprites) {
          const card = document.createElement('article');
          const title = document.createElement('h2');
          title.textContent = name;
          const artwork = document.createElement('div');
          artwork.className = 'artwork';
          artwork.style.backgroundImage = transparent.checked ? '' : 'none';
          const canvas = document.createElement('canvas');
          const framePicker = document.createElement('select');
          framePicker.className = 'frame';
          framePicker.setAttribute('aria-label', `${name} frame`);
          sprite.frames.forEach((_, index) =>
            framePicker.add(new Option(`Frame ${index + 1}`, String(index))),
          );

          function drawFrame() {
            const frame = sprite.frames[Number(framePicker.value)];
            canvas.width = frame.width * zoom;
            canvas.height = frame.height * zoom;
            const context = canvas.getContext('2d');
            context.imageSmoothingEnabled = false;
            context.drawImage(
              atlas,
              frame.x,
              frame.y,
              frame.width,
              frame.height,
              0,
              0,
              canvas.width,
              canvas.height,
            );
          }

          drawFrame();
          framePicker.addEventListener('change', drawFrame);
          artwork.append(canvas);
          const details = document.createElement('div');
          details.className = 'details';
          details.textContent = `${sprite.frames.length} frame${sprite.frames.length === 1 ? '' : 's'} · ${sprite.footprint.width}×${sprite.footprint.height} tile`;
          card.append(title, artwork);
          if (sprite.frames.length > 1) card.append(framePicker);
          card.append(details);
          gallery.append(card);
        }
      }

      category.addEventListener('change', render);
      search.addEventListener('input', render);
      scale.addEventListener('input', render);
      transparent.addEventListener('change', render);
      render();
    </script>
  </body>
</html>
